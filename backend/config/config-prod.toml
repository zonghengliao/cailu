# 生产环境覆盖配置（profile=prod）
#
# 部署前必须注入的环境变量：
#   ALUN_MIDDLEWARE_AUTH_JWT_SECRET   JWT 签名密钥（至少 32 字符，务必更换）
#   ALUN_DATABASE_HOST / ALUN_DATABASE_NAME / ALUN_DATABASE_USER / ALUN_DATABASE_PASSWORD
#   ALUN_SERVER_LISTEN                监听地址（容器内通常为 0.0.0.0:8023）

[log]
format = "json"

[database]
# 生产强制 SSL
ssl_mode = "require"
max_connections = 30
min_connections = 5

[cache]
type = "redis"

[redis]
enabled = true

[middleware.auth]
# 开启认证；jwt_secret 由 ALUN_MIDDLEWARE_AUTH_JWT_SECRET 注入，不落配置文件
enabled = true
# TTL 必须在**每个 profile** 里重复写一遍（CODE-16 B1）：
#   alun-config 0.4.2 的 merge_middleware 判定是 `overlay.auth.access_token_expire_secs != 0`，
#   而 profile 缺该字段时 serde 填的是编译期默认值 7200/604800（≠ 0），
#   于是基础配置 config.toml 的值会被 profile 的默认值盖掉（实测 `print-config` 仍输出 7200）。
# access 15 分钟；refresh 24 小时是**绝对上限**（登录时刻 + 该值，轮换不滑动）。
access_token_expire_secs = 900
refresh_token_expire_secs = 86400

[middleware.permission]
# 生产环境开启权限校验：宏规则（#[alun::permission]）经此开关统一生效
enabled = true

[middleware.cors]
allow_origins = ["https://admin.example.com"]

[middleware.rate_limit]
enabled = true
requests_per_window = 300
window_secs = 60
