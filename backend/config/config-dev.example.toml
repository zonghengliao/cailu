# 开发环境覆盖配置模板（profile=dev）
#
# 用法：`cp backend/config/config-dev.example.toml backend/config/config-dev.toml`
#       然后按本机情况修改。config-dev.toml **不入库**（.gitignore），
#       因为环境私有配置里迟早会出现密钥。
#
# 只写「与基础配置/编译期默认值不同」的字段：基础配置里已是目标值的项不必重复。

[log]
# 开发期需要看到 SQL 与框架调试日志
level = "debug"

[database]
# 打印每条 SQL，便于定位查询问题
sql_logging = true
slow_query_ms = 200

# 开发期本机已启动 redis 容器，改用 redis 缓存以贴近生产验证缓存失效逻辑
[cache]
type = "redis"

[redis]
enabled = true

[middleware.auth]
# 开发环境开启认证。jwt_secret **绝不写在这里**，只经环境变量注入：
#   ALUN_MIDDLEWARE_AUTH_JWT_SECRET=$(openssl rand -hex 32)
# 缺失或短于 32 字符时进程拒绝启动（见 src/shared/startup_guard.rs）。
enabled = true
# TTL 必须在**每个 profile** 里重复写一遍（CODE-16 B1）：
#   alun-config 0.4.2 的 merge_middleware 判定是 `overlay.auth.access_token_expire_secs != 0`，
#   而 profile 缺该字段时 serde 填的是编译期默认值 7200/604800（≠ 0），
#   于是基础配置 config.toml 的值会被 profile 的默认值盖掉（实测 `print-config` 仍输出 7200）。
# access 15 分钟；refresh 24 小时是**绝对上限**（登录时刻 + 该值，轮换不滑动）。
access_token_expire_secs = 900
refresh_token_expire_secs = 86400
