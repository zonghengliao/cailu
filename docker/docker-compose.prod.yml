# 菜芦通用后台系统 —— 生产编排（postgres + redis + backend + frontend）
#
# 前置：直接执行 scripts/deploy.sh（会先构建前端 dist、构建镜像并拉起本编排）；
# 后端镜像在容器内多阶段编译，通过 crates.io 依赖 Alun 框架 0.4.2，无需本地框架源码（见 docker/backend/Dockerfile）。
#
# 使用：
#   cd cailu/cailu
#   bash scripts/deploy.sh
#   或手动分步：
#   bash scripts/build.sh                                   # 前端 dist（后端镜像不依赖本机二进制）
#   后端通过 crates.io 依赖 Alun 框架 0.4.2，构建时由 cargo 自动拉取，无需本地框架源码、无需暂存步骤
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# 生产敏感值必须通过环境变量注入（不落文件）：
#   export ALUN_DATABASE_PASSWORD=...
#   export ALUN_MIDDLEWARE_AUTH_JWT_SECRET=...
#   export ALUN_ADMIN_PASSWORD=...

# 独立项目名：与 docker-compose.yml（开发依赖）分离，避免同目录下共享默认
# 项目名导致 `docker compose down` 误删对方容器
name: cailu-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: cailu-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cailu
      POSTGRES_USER: alun
      POSTGRES_PASSWORD: ${ALUN_DATABASE_PASSWORD:?请设置 ALUN_DATABASE_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alun -d cailu"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cailu-prod-redis
    restart: unless-stopped
    # --maxmemory-policy noeviction（CODE-16 B6）：**不要**改回 allkeys-lru。
    # 这个 Redis 里存的是令牌吊销状态（token:blacklist:* / token:rotated:* / online:*）：
    #   · 淘汰 = 黑名单 / 轮换标记失效 = 已登出、已被强制下线的令牌重新可用（吊销静默失效）；
    #   · 轮换标记丢失还会让「一次性 refresh」退化成可重放。
    # 因此宁可让写在内存满时失败（后端会把失败回传给调用方，返回 5xx），也不允许悄悄淘汰。
    # 内存水位必须按「不会写满」来设计，阈值见 docs/session-revocation-durability.md：
    #   used_memory 持续 > 70% 告警，> 85% 严重告警（此时写入开始被拒）。
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: cailu-prod-backend
    container_name: cailu-backend
    restart: unless-stopped
    environment:
      ALUN_PROFILE: prod
      ALUN_SERVER_LISTEN: 0.0.0.0:8023
      ALUN_DATABASE_HOST: postgres
      ALUN_DATABASE_PORT: 5432
      ALUN_DATABASE_NAME: cailu
      ALUN_DATABASE_USER: alun
      ALUN_DATABASE_PASSWORD: ${ALUN_DATABASE_PASSWORD:?请设置 ALUN_DATABASE_PASSWORD}
      ALUN_DATABASE_SSL_MODE: disable
      ALUN_REDIS_URL: redis://redis:6379
      ALUN_MIDDLEWARE_AUTH_JWT_SECRET: ${ALUN_MIDDLEWARE_AUTH_JWT_SECRET:?请设置 ALUN_MIDDLEWARE_AUTH_JWT_SECRET}
      ALUN_ADMIN_PASSWORD: ${ALUN_ADMIN_PASSWORD:?请设置 ALUN_ADMIN_PASSWORD（管理员初始口令，禁止使用缺省值）}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - downloads:/app/downloads
      - logs:/app/logs

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    image: cailu-prod-frontend
    container_name: cailu-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
    name: cailu-prod-pgdata
  redisdata:
    name: cailu-prod-redisdata
  uploads:
    name: cailu-uploads
  downloads:
    name: cailu-downloads
  logs:
    name: cailu-logs
